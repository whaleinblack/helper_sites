# Included inside the chufa.wang HTTPS server block (before `location /`).
location = /drive {
    return 308 /drive/;
}

location ^~ /drive/ {
    proxy_pass http://127.0.0.1:4191;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # uploads arrive as 8 MB chunks; stream them straight to the app
    client_max_body_size 20m;
    proxy_request_buffering off;
    # stream large downloads / zip archives without temp files
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
