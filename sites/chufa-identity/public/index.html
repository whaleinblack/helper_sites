<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出发网 · 统一账户</title><link rel="stylesheet" href="/account/style.css"><script src="/account/app.js" defer></script></head><body><main><a class="brand" href="/">出发网</a><h1>一个账号，连接你的出发网</h1><p class="intro">旅行、网盘与管理工具，共用一套登录身份。</p><p id="message" role="status" aria-live="polite"></p>
<section id="guest" hidden><div class="tabs" role="tablist" aria-label="登录或注册"><button type="button" role="tab" id="tab-login" aria-controls="login" aria-selected="true">登录</button><button type="button" role="tab" id="tab-register" aria-controls="register" aria-selected="false" hidden>注册</button></div>
<form id="login" role="tabpanel" aria-labelledby="tab-login"><label>账号或邮箱<input name="identifier" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<form id="register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32" spellcheck="false" aria-describedby="register-rules"></label><label>邮箱<input name="email" type="email" autocomplete="email" required maxlength="254" spellcheck="false"></label><label>密码<input name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="register-rules"></label><ul id="register-rules" class="rules"><li>用户名 3–32 位，只用英文字母、数字或 . _ -，并以字母或数字开头。</li><li>密码至少 8 个字符，包含大写字母、小写字母、数字、符号中的任意三类。</li><li>注册后默认开通旅行规划；网盘、开发站和管理工具需管理员另行开通。邮箱暂不验证。</li></ul><button>注册并登录</button></form></section>
<section id="signed" hidden><h2 id="identity"></h2><nav id="services" aria-label="可访问服务"></nav><button id="logout" class="secondary">退出所有站点的当前登录</button><details><summary>修改统一账号密码</summary><form id="password"><label>当前密码<input name="current" type="password" autocomplete="current-password" required></label><label>新密码<input name="next" type="password" autocomplete="new-password" required minlength="8"></label><p>至少 8 个字符，包含大小写字母、数字、符号中的三种。</p><button>保存新密码</button></form></details></section></main></body></html>
