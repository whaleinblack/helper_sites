<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出发网 · 统一账户</title><link rel="stylesheet" href="/account/style.css"><script src="/account/app.js" defer></script></head><body><main><a class="brand" href="/">出发网</a><h1>一个账号，连接你的出发网</h1><p class="intro">旅行、网盘与管理工具，共用一套登录身份。</p><p id="message" role="status" aria-live="polite"></p><form id="login" hidden><label>账号或邮箱<input name="identifier" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><section id="signed" hidden><h2 id="identity"></h2><nav id="services" aria-label="可访问服务"></nav><button id="logout" class="secondary">退出所有站点的当前登录</button><details><summary>修改统一账号密码</summary><form id="password"><label>当前密码<input name="current" type="password" autocomplete="current-password" required></label><label>新密码<input name="next" type="password" autocomplete="new-password" required minlength="8"></label><p>至少 8 个字符，包含大小写字母、数字、符号中的三种。</p><button>保存新密码</button></form></details></section></main></body></html>
