  <div class="launch-divider" aria-hidden="true"></div>

  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-head">
      <span class="auth-badge" data-i18n="badge">出发网账号</span>
      <div class="language-row" role="group" aria-label="显示语言" data-i18n-label="languageLabel">
        <button type="button" id="lang-zh" aria-pressed="true">中文</button>
        <button type="button" id="lang-en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="auth-copy">
      <h1 id="auth-title">登录或注册出发网账号</h1>
      <p id="auth-intro">旅行、网盘与管理工具共用一套登录身份。注册只需用户名、邮箱和密码。</p>
    </div>
    <p id="message" role="status" aria-live="polite"></p>

    <section id="guest" hidden>
      <div class="tabs" role="tablist" aria-label="登录或注册" data-i18n-label="tabsLabel">
        <button type="button" role="tab" id="tab-login" aria-controls="login" aria-selected="true" data-i18n="tabLogin">登录</button>
        <button type="button" role="tab" id="tab-register" aria-controls="register" aria-selected="false" data-i18n="tabRegister" hidden>注册</button>
      </div>
      <form id="login" role="tabpanel" aria-labelledby="tab-login">
        <label class="field"><span data-i18n="fieldIdentifier">邮箱 / 用户名</span><input name="identifier" autocomplete="username" required spellcheck="false" placeholder="请输入邮箱或用户名" data-i18n-placeholder="placeholderIdentifier"></label>
        <label class="field"><span data-i18n="fieldPassword">密码</span><input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码" data-i18n-placeholder="placeholderPassword"></label>
        <button class="auth-button" data-i18n="buttonLogin">登录</button>
      </form>
      <form id="register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
        <label class="field"><span data-i18n="fieldUsername">用户名</span><input name="username" autocomplete="username" required minlength="3" maxlength="32" spellcheck="false" aria-describedby="register-rules" placeholder="3–32 位字母、数字或 . _ -" data-i18n-placeholder="placeholderUsername"></label>
        <label class="field"><span data-i18n="fieldEmail">邮箱</span><input name="email" type="email" autocomplete="email" required maxlength="254" spellcheck="false" placeholder="name@example.com"></label>
        <label class="field"><span data-i18n="fieldPassword">密码</span><input name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="register-rules" placeholder="至少 8 个字符" data-i18n-placeholder="placeholderNewPassword"></label>
        <ul id="register-rules" class="rules">
          <li data-i18n="ruleUsername">用户名 3–32 位，只用英文字母、数字或 . _ -，并以字母或数字开头。</li>
          <li data-i18n="rulePassword">密码至少 8 个字符，包含大写字母、小写字母、数字、符号中的任意三类。</li>
          <li data-i18n="ruleGrants">注册后默认开通旅行规划；网盘、开发站和管理工具需管理员另行开通。邮箱暂不验证。</li>
        </ul>
        <button class="auth-button" data-i18n="buttonRegister">注册并登录</button>
      </form>
    </section>

    <section id="signed" hidden>
      <h2 id="identity"></h2>
      <p class="services-title" data-i18n="servicesTitle">可以进入的服务</p>
      <nav id="services" aria-label="可访问服务" data-i18n-label="servicesTitle"></nav>
      <details>
        <summary data-i18n="passwordSummary">修改统一账号密码</summary>
        <form id="password">
          <label class="field"><span data-i18n="fieldCurrentPassword">当前密码</span><input name="current" type="password" autocomplete="current-password" required></label>
          <label class="field"><span data-i18n="fieldNewPassword">新密码</span><input name="next" type="password" autocomplete="new-password" required minlength="8"></label>
          <p class="hint" data-i18n="passwordHint">至少 8 个字符，包含大小写字母、数字、符号中的三种。</p>
          <button class="auth-button" data-i18n="buttonSavePassword">保存新密码</button>
        </form>
      </details>
      <button id="logout" class="auth-button ghost" data-i18n="buttonLogout">退出所有站点的当前登录</button>
    </section>
  </section>

  <a class="launch-home" href="/" data-i18n="backHome">返回出发网主页</a>
</main>
</body>
</html>
