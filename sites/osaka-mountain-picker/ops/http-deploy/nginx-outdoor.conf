location = /outdoor {
    return 308 /outdoor/;
}

location = /outdoor/api/weather {
    auth_basic "Restricted Outdoor";
    auth_basic_user_file /etc/nginx/.htpasswd_chufa_outdoor;
    proxy_pass http://127.0.0.1:4188/weather;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 90;
    proxy_send_timeout 90;
}

location ^~ /outdoor/ {
    auth_basic "Restricted Outdoor";
    auth_basic_user_file /etc/nginx/.htpasswd_chufa_outdoor;
    rewrite ^/outdoor/(.*)$ /$1 break;
    root /srv/helper_sites/releases/osaka-mountain-picker-http/current/site;
    index index.html;
    try_files $uri $uri/ =404;
}
